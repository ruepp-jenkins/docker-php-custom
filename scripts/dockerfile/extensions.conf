# Single source of truth for everything that gets installed on top of the php base image.
# Read by the install scripts in this folder and by scripts/test_image.sh (which verifies the built image).
#
# Format (one entry per line, no inline comments):
#   ext    <name> [configure args]   extension built with docker-php-ext-install (configure args optional)
#   pecl   <name>                    extension installed with pecl
#   apache <name>                    apache module enabled with a2enmod
#   smoke  <name> <php expression>   optional check run by scripts/test_image.sh, must evaluate to true
#
# Extensions the base image already ships (e.g. opcache since PHP 8.5) are skipped automatically.

ext gd --enable-gd --with-jpeg --with-webp --with-freetype --with-xpm
ext zip --with-zip
ext dom
ext intl
ext mbstring
ext mysqli
ext opcache
ext pdo
ext pdo_mysql
ext xsl

pecl imagick

apache rewrite

smoke gd function_exists('imagewebp') && function_exists('imagecreatefromxpm') && gd_info()['FreeType Support'] && gd_info()['JPEG Support']
smoke imagick in_array('WEBP', Imagick::queryFormats()) && in_array('JPEG', Imagick::queryFormats())
smoke intl (new NumberFormatter('de_DE', NumberFormatter::DECIMAL))->format(1234.5) === '1.234,5'
smoke mbstring mb_strtoupper('äöü') === 'ÄÖÜ'
smoke zip class_exists('ZipArchive')
smoke xsl class_exists('XSLTProcessor')
smoke mysqli function_exists('mysqli_connect')
smoke pdo_mysql in_array('mysql', PDO::getAvailableDrivers())
